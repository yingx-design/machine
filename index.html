<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Take Your Design</title>


<style>

/* ==================================================
   BASIC
================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;

  width: 100%;
  min-height: 100%;

  background: #efefef;

  font-family:
    Arial,
    Helvetica,
    sans-serif;
}

body {
  overflow-x: hidden;
}

.page {
  position: relative;

  width: 100%;
  min-height: 100vh;
}


/* ==================================================
   INSTRUCTION
================================================== */

.instruction {
  position: fixed;

  left: 28px;
  top: 28px;

  z-index: 100;

  font-size: 15px;

  letter-spacing: 1.5px;

  color: #111;

  pointer-events: none;
}


/* ==================================================
   MACHINE
================================================== */

.machine {
  position: relative;

  width: 560px;

  margin: 20px auto;
}

.machine-image {
  display: block;

  width: 100%;
  height: auto;

  pointer-events: none;

  user-select: none;
}


/* ==================================================
   PRODUCTS
================================================== */

.product {
  position: absolute;

  z-index: 10;

  object-fit: contain;

  transform:
    translate(-50%, -50%);

  transform-origin: center;

  cursor: pointer;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.15)
    );

  transition:
    transform .15s ease,
    filter .15s ease,
    opacity .25s ease;
}


.product:hover {
  transform:
    translate(-50%, -50%)
    scale(1.08);

  filter:
    drop-shadow(
      0 5px 4px
      rgba(0,0,0,.22)
    );
}


/* ==================================================
   PRODUCT SIZE
   商品整体放大
================================================== */

#a1 {
  width: 64px;
  height: 82px;
}

#a2 {
  width: 94px;
  height: 94px;
}

#a3 {
  width: 94px;
  height: 94px;
}


#b1 {
  width: 94px;
  height: 100px;
}

#b2 {
  width: 74px;
  height: 98px;
}

#b3 {
  width: 94px;
  height: 94px;
}


#c1 {
  width: 94px;
  height: 94px;
}

#c2 {
  width: 94px;
  height: 98px;
}

#c3 {
  width: 90px;
  height: 94px;
}


#d1 {
  width: 82px;
  height: 90px;
}


/* ==================================================
   PRODUCT POSITION

   之前：
   17 / 37 / 57

   现在整体向右：
   21 / 41 / 61

   同时整体向上
================================================== */


/* =========================
   ROW A
========================= */

#a1 {
  left: 21%;
  top: 21.5%;
}

#a2 {
  left: 41%;
  top: 21.5%;
}

#a3 {
  left: 61%;
  top: 21.5%;
}


/* =========================
   ROW B
========================= */

#b1 {
  left: 21%;
  top: 39%;
}

#b2 {
  left: 41%;
  top: 39%;
}

#b3 {
  left: 61%;
  top: 39%;
}


/* =========================
   ROW C
========================= */

#c1 {
  left: 21%;
  top: 56.5%;
}

#c2 {
  left: 41%;
  top: 56.5%;
}

#c3 {
  left: 61%;
  top: 56.5%;
}


/* =========================
   ROW D

   D1 单独往上移动
   回到第四排货架
========================= */

#d1 {
  left: 21%;
  top: 68%;
}


/* ==================================================
   LABELS
================================================== */

.label {
  position: absolute;

  z-index: 20;

  transform:
    translate(-50%, -50%);

  background: white;

  color: black;

  padding: 3px 6px;

  border-radius: 2px;

  font-size: 11px;

  font-weight: bold;

  pointer-events: none;
}


/* =========================
   ROW A LABELS
========================= */

#a1-label {
  left: 21%;
  top: 28.3%;
}

#a2-label {
  left: 41%;
  top: 28.3%;
}

#a3-label {
  left: 61%;
  top: 28.3%;
}


/* =========================
   ROW B LABELS
========================= */

#b1-label {
  left: 21%;
  top: 45.8%;
}

#b2-label {
  left: 41%;
  top: 45.8%;
}

#b3-label {
  left: 61%;
  top: 45.8%;
}


/* =========================
   ROW C LABELS
========================= */

#c1-label {
  left: 21%;
  top: 63.3%;
}

#c2-label {
  left: 41%;
  top: 63.3%;
}

#c3-label {
  left: 61%;
  top: 63.3%;
}


/* =========================
   ROW D LABEL
========================= */

#d1-label {
  left: 21%;
  top: 73%;
}


/* ==================================================
   INVISIBLE COIN SLOT

   不显示红框
================================================== */

.coin-slot {
  position: absolute;

  right: 8%;
  top: 31.5%;

  width: 10%;
  height: 11%;

  z-index: 9;
}


/* ==================================================
   COIN

   保持你现在正确的位置
================================================== */

.coin {
  position: fixed;

  left: 35px;
  bottom: 35px;

  width: 76px;
  height: 76px;

  object-fit: contain;

  cursor: grab;

  z-index: 100;

  user-select: none;

  -webkit-user-select: none;

  filter:
    drop-shadow(
      0 8px 7px
      rgba(0,0,0,.30)
    );

  transition:
    transform .15s ease;
}


.coin:hover {
  transform:
    scale(1.08);
}


.coin.dragging {
  cursor: grabbing;

  transform:
    scale(1.13);
}


/* ==================================================
   STATUS
================================================== */

.status {
  position: fixed;

  left:
    calc(50% + 360px);

  top: 245px;

  z-index: 100;

  font-family: monospace;

  font-size: 15px;

  color: #ff2525;
}


/* ==================================================
   THANK YOU
================================================== */

.thankyou {
  position: fixed;

  left:
    calc(50% + 330px);

  top: 405px;

  z-index: 100;

  background: #111;

  color: white;

  padding: 9px 16px;

  font-size: 14px;

  font-weight: bold;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .2s ease;
}


.thankyou.show {
  opacity: 1;
}


/* ==================================================
   FALLING PRODUCT
================================================== */

.dispensing {
  position: fixed;

  z-index: 9998;

  object-fit: contain;

  pointer-events: none;

  transform-origin: center;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 850px) {

  .machine {
    width:
      min(560px, 92vw);

    margin-top: 70px;
  }


  .instruction {
    left: 15px;
    top: 15px;

    font-size: 12px;
  }


  .coin {
    width: 55px;
    height: 55px;

    left: 15px;
    bottom: 15px;
  }

}

</style>

</head>



<body>


<div class="page">


  <!-- ==================================================

  =================================================== -->

  <div

    id="instruction"
  >
    DRAG THE COIN → SELECT SOMETHING
  </div>



  <!-- ==================================================

  =================================================== -->

    <!-- MACHINE IMAGE -->

    <img

    <!-- A1 -->

    >

    <!-- A3 -->

    <img
      src="dad-healer.png"
      class="product"
      id="a3"

      draggable="false"
    >

    <div
      class="label"

    >
      A3

    <!-- ==================================================

    =================================================== -->


    <!-- B1 -->

    <img

      class="product"
      id="b1"

      draggable="false"
    >

    <div
      class="label"
      id="b1-label"
    >
      B1
    </div>



    <!-- B2 -->

    <img
      src="perfume.png"
      class="product"
      id="b2"
      data-code="B2"
      draggable="false"
    >

    <div
      class="label"
      id="b2-label"
    >
      B2
    </div>



    <!-- B3 -->

    <img
      src="body-fonts.png"
      class="product"
      id="b3"
      data-code="B3"
      draggable="false"
    >

    <div
      class="label"
      id="b3-label"
    >
      B3
    </div>



    <!-- ==================================================
         ROW C
    =================================================== -->


    <!-- C1 -->

    <img
      src="city-walk.png"
      class="product"
      id="c1"
      data-code="C1"
      draggable="false"
    >

    <div
      class="label"
      id="c1-label"
    >
      C1
    </div>



    <!-- C2 -->

    <img
      src="quiet-town.png"
      class="product"
      id="c2"
      data-code="C2"
      draggable="false"
    >

    <div
      class="label"
      id="c2-label"
    >
      C2
    </div>



    <!-- C3 -->

    <img
      src="hypertext.png"
      class="product"
      id="c3"
      data-code="C3"
      draggable="false"
    >

    <div
      class="label"
      id="c3-label"
    >
      C3
    </div>



    <!-- ==================================================
         ROW D
    =================================================== -->


    <!-- D1 -->

    <img
      src="in-between.png"
      class="product"
      id="d1"
      data-code="D1"
      draggable="false"
    >

    <div
      class="label"
      id="d1-label"
    >
      D1
    </div>


  </div>



  <!-- ==================================================
       COIN
  =================================================== -->

  <img
    src="coin.png"
    class="coin"
    id="coin"
    alt="Coin"
    draggable="false"
  >



  <!-- ==================================================
       STATUS
  =================================================== -->

  <div
    class="status"
    id="status"
  >
    $0.00
  </div>



  <!-- ==================================================
       THANK YOU
  =================================================== -->

  <div
    class="thankyou"
    id="thankyou"
  >
    THANK YOU
  </div>


</div>



<script>

/* ==================================================
   ELEMENTS
================================================== */

const coin =
  document.getElementById(
    "coin"
  );


const coinSlot =
  document.getElementById(
    "coinSlot"
  );


const machine =
  document.getElementById(
    "machine"
  );


const status =
  document.getElementById(
    "status"
  );


const thankyou =
  document.getElementById(
    "thankyou"
  );


const instruction =
  document.getElementById(
    "instruction"
  );


const products =
  document.querySelectorAll(
    ".product"
  );



/* ==================================================
   STATE
================================================== */

let dragging = false;

let paid = false;

let dispensing = false;

let offsetX = 0;

let offsetY = 0;



/* ==================================================
   COIN DRAG START
================================================== */

coin.addEventListener(
  "mousedown",
  function(e) {


    if (
      paid ||
      dispensing
    ) {
      return;
    }


    e.preventDefault();


    dragging = true;


    coin.classList.add(
      "dragging"
    );


    const rect =
      coin.getBoundingClientRect();


    offsetX =
      e.clientX -
      rect.left;


    offsetY =
      e.clientY -
      rect.top;


    coin.style.bottom =
      "auto";


    coin.style.transition =
      "none";

  }
);



/* ==================================================
   COIN MOVE
================================================== */

document.addEventListener(
  "mousemove",
  function(e) {


    if (!dragging) {
      return;
    }


    coin.style.left =
      (
        e.clientX -
        offsetX
      ) + "px";


    coin.style.top =
      (
        e.clientY -
        offsetY
      ) + "px";

  }
);



/* ==================================================
   COIN RELEASE
================================================== */

document.addEventListener(
  "mouseup",
  function() {


    if (!dragging) {
      return;
    }


    dragging = false;


    coin.classList.remove(
      "dragging"
    );


    checkCoin();

  }
);



/* ==================================================
   CHECK COIN
================================================== */

function checkCoin() {


  const coinRect =
    coin.getBoundingClientRect();


  const slotRect =
    coinSlot.getBoundingClientRect();



  const x =
    coinRect.left +
    coinRect.width / 2;


  const y =
    coinRect.top +
    coinRect.height / 2;



  const inside =

    x >
    slotRect.left &&

    x <
    slotRect.right &&

    y >
    slotRect.top &&

    y <
    slotRect.bottom;



  if (inside) {


    paid = true;


    status.textContent =
      "$1.00";


    instruction.textContent =
      "COIN ACCEPTED → SELECT AN ITEM";



    coin.style.transition =
      "all .30s ease";


    coin.style.left =
      (
        slotRect.left +
        slotRect.width / 2 -
        coinRect.width / 2
      ) + "px";


    coin.style.top =
      (
        slotRect.top +
        slotRect.height / 2 -
        coinRect.height / 2
      ) + "px";


    coin.style.transform =
      "scale(.05) rotate(180deg)";


    coin.style.opacity =
      "0";


  }


  else {


    resetCoin();


  }

}



/* ==================================================
   RESET COIN
================================================== */

function resetCoin() {


  coin.style.transition =
    "all .35s ease";


  coin.style.transform =
    "";


  coin.style.opacity =
    "1";


  coin.style.left =
    "35px";


  coin.style.top =
    "auto";


  coin.style.bottom =
    "35px";

}



/* ==================================================
   PRODUCT CLICK
================================================== */

products.forEach(
  function(product) {


    product.addEventListener(
      "click",
      function() {


        if (dispensing) {
          return;
        }



        if (!paid) {


          status.textContent =
            "INSERT COIN";


          instruction.textContent =
            "INSERT COIN FIRST";


          setTimeout(
            function() {


              if (!paid) {


                status.textContent =
                  "$0.00";


                instruction.textContent =
                  "DRAG THE COIN → SELECT SOMETHING";


              }


            },
            1000
          );


          return;

        }



        dispenseProduct(
          product
        );


      }
    );

  }
);



/* ==================================================
   DISPENSE PRODUCT
================================================== */

function dispenseProduct(
  product
) {


  if (
    !paid ||
    dispensing
  ) {
    return;
  }


  dispensing =
    true;


  paid =
    false;



  const productRect =
    product.getBoundingClientRect();


  const machineRect =
    machine.getBoundingClientRect();



  /* ==================================================
     CREATE FALLING PRODUCT
  ================================================== */


  const falling =
    document.createElement(
      "img"
    );


  falling.src =
    product.getAttribute(
      "src"
    );


  falling.className =
    "dispensing";


  falling.style.width =
    productRect.width +
    "px";


  falling.style.height =
    productRect.height +
    "px";


  falling.style.left =
    productRect.left +
    "px";


  falling.style.top =
    productRect.top +
    "px";


  falling.style.transform =
    "rotate(0deg) scale(1)";


  falling.style.opacity =
    "1";


  falling.style.transition =
    "left .85s cubic-bezier(.3,.05,.7,1), " +
    "top .85s cubic-bezier(.3,.05,.7,1), " +
    "transform .85s ease";


  document.body.appendChild(
    falling
  );



  /* ==================================================
     ORIGINAL PRODUCT DISAPPEARS
  ================================================== */


  product.style.visibility =
    "hidden";



  /* ==================================================
     PICKUP POSITION
  ================================================== */


  const pickupX =
    machineRect.left +
    machineRect.width *
    0.36;


  const pickupY =
    machineRect.top +
    machineRect.height *
    0.82;



  /* ==================================================
     FALL
  ================================================== */


  requestAnimationFrame(
    function() {


      requestAnimationFrame(
        function() {


          falling.style.left =
            (
              pickupX -
              productRect.width / 2
            ) + "px";


          falling.style.top =
            (
              pickupY -
              productRect.height / 2
            ) + "px";


          falling.style.transform =
            "rotate(12deg) scale(.95)";


        }
      );


    }
  );



  status.textContent =
    "$0.00";


  instruction.textContent =
    "DISPENSING...";



  /* ==================================================
     PICK UP
  ================================================== */


  setTimeout(
    function() {


      thankyou.classList.add(
        "show"
      );


      instruction.textContent =
        "PICK UP YOUR DESIGN";


    },
    850
  );



  /* ==================================================
     FADE
  ================================================== */


  setTimeout(
    function() {


      falling.style.transition =
        "opacity .35s ease";


      falling.style.opacity =
        "0";


    },
    2500
  );



  /* ==================================================
     RESET
  ================================================== */


  setTimeout(
    function() {


      falling.remove();


      product.style.visibility =
        "visible";


      thankyou.classList.remove(
        "show"
      );


      resetCoin();


      status.textContent =
        "$0.00";


      instruction.textContent =
        "DRAG THE COIN → SELECT SOMETHING";


      dispensing =
        false;


    },
    2900
  );


}

</script>
