<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Take Your Design</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #efefef;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  overflow-x: hidden;
}

/* ==============================
   PAGE
============================== */

.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
}

.instruction {
  position: fixed;
  left: 28px;
  top: 28px;

  font-size: 15px;
  letter-spacing: 1.5px;

  color: #111;

  z-index: 50;
}


/* ==============================
   MACHINE
============================== */

.machine {
  position: relative;

  width: 560px;

  margin: 20px auto;
}

.machine-image {
  display: block;

  width: 100%;
  height: auto;
}


/* ==============================
   PRODUCTS
============================== */

.product {
  position: absolute;

  z-index: 10;

  object-fit: contain;

  transform: translate(-50%, -50%);

  transform-origin: center;

  cursor: pointer;

  filter:
    drop-shadow(
      0 3px 2px
      rgba(0,0,0,.15)
    );

  transition:
    transform .15s ease,
    filter .15s ease;
}

.product:hover {
  transform:
    translate(-50%, -50%)
    scale(1.08);

  filter:
    drop-shadow(
      0 5px 4px
      rgba(0,0,0,.22)
    );
}


/* ==============================
   PRODUCT SIZE
============================== */

#a1 {
  width: 54px;
  height: 70px;
}

#a2 {
  width: 82px;
  height: 82px;
}

#a3 {
  width: 82px;
  height: 82px;
}

#b1 {
  width: 82px;
  height: 86px;
}

#b2 {
  width: 64px;
  height: 86px;
}

#b3 {
  width: 82px;
  height: 82px;
}

#c1 {
  width: 82px;
  height: 82px;
}

#c2 {
  width: 82px;
  height: 86px;
}

#c3 {
  width: 78px;
  height: 82px;
}

#d1 {
  width: 70px;
  height: 78px;
}


/* ==============================
   PRODUCT POSITION
============================== */

/* ROW A */

#a1 {
  left: 17%;
  top: 24%;
}

#a2 {
  left: 37%;
  top: 24%;
}

#a3 {
  left: 57%;
  top: 24%;
}


/* ROW B */

#b1 {
  left: 17%;
  top: 41.5%;
}

#b2 {
  left: 37%;
  top: 41.5%;
}

#b3 {
  left: 57%;
  top: 41.5%;
}


/* ROW C */

#c1 {
  left: 17%;
  top: 59%;
}

#c2 {
  left: 37%;
  top: 59%;
}

#c3 {
  left: 57%;
  top: 59%;
}


/* ROW D */

#d1 {
  left: 17%;
  top: 74%;
}


/* ==============================
   LABELS
============================== */

.label {
  position: absolute;

  z-index: 20;

  transform:
    translate(-50%, -50%);

  background: white;
  color: black;

  padding: 3px 6px;

  border-radius: 2px;

  font-size: 11px;
  font-weight: bold;

  pointer-events: none;
}


#a1-label {
  left: 17%;
  top: 30.5%;
}

#a2-label {
  left: 37%;
  top: 30.5%;
}

#a3-label {
  left: 57%;
  top: 30.5%;
}


#b1-label {
  left: 17%;
  top: 48%;
}

#b2-label {
  left: 37%;
  top: 48%;
}

#b3-label {
  left: 57%;
  top: 48%;
}


#c1-label {
  left: 17%;
  top: 65.5%;
}

#c2-label {
  left: 37%;
  top: 65.5%;
}

#c3-label {
  left: 57%;
  top: 65.5%;
}


#d1-label {
  left: 17%;
  top: 80%;
}


/* ==============================
   COIN SLOT

   红色区域就是有效投币区
============================== */

.coin-slot {
  position: absolute;

  left: 79%;
  top: 27%;

  width: 14%;
  height: 16%;

  z-index: 30;

  background:
    rgba(255, 0, 0, 0.20);

  border:
    2px solid red;

  border-radius: 8px;
}


/* ==============================
   COIN
============================== */

.coin {
  position: fixed;

  width: 72px;
  height: 72px;

  left: 45px;
  bottom: 45px;

  object-fit: contain;

  z-index: 100;

  cursor: grab;

  user-select: none;

  touch-action: none;

  filter:
    drop-shadow(
      0 5px 5px
      rgba(0,0,0,.18)
    );
}

.coin:active {
  cursor: grabbing;
}


/* ==============================
   STATUS
============================== */

.status {
  position: fixed;

  left:
    calc(50% + 360px);

  top: 245px;

  font-family: monospace;

  font-size: 15px;

  color: #ff2525;

  z-index: 50;
}


.thankyou {
  position: fixed;

  left:
    calc(50% + 330px);

  top: 405px;

  background: #111;
  color: white;

  padding: 9px 16px;

  font-size: 14px;
  font-weight: bold;

  opacity: 0;

  transition:
    opacity .2s ease;

  z-index: 50;
}


.thankyou.show {
  opacity: 1;
}


/* ==============================
   FALLING ITEM
============================== */

.dispensing {
  position: fixed;

  z-index: 1000;

  object-fit: contain;

  pointer-events: none;

  transform-origin: center;

  transition:
    left .75s
      cubic-bezier(.4,.05,.75,.3),

    top .75s
      cubic-bezier(.4,.05,.75,.3),

    transform .75s ease;
}


/* ==============================
   MOBILE
============================== */

@media (max-width: 850px) {

  .machine {
    width:
      min(560px, 92vw);

    margin-top: 70px;
  }

  .instruction {
    left: 15px;
    top: 15px;

    font-size: 12px;
  }

  .coin {
    width: 58px;
    height: 58px;

    left: 20px;
    bottom: 25px;
  }

  .status,
  .thankyou {
    display: none;
  }
}

</style>
</head>


<body>

<div class="page">

  <div
    class="instruction"
    id="instruction"
  >
    DRAG THE COIN INTO THE RED AREA
  </div>


  <div
    class="machine"
    id="machine"
  >

    <!-- MACHINE -->

    <img
      src="vending-machine.png"
      class="machine-image"
      alt="Vending Machine"
    >


    <!-- COIN TARGET -->

    <div
      class="coin-slot"
      id="coinSlot"
    ></div>


    <!-- =====================
         ROW A
    ====================== -->

    <img
      src="groundcycle.png"
      class="product"
      id="a1"
      data-code="A1"
    >

    <div
      class="label"
      id="a1-label"
    >
      A1
    </div>


    <img
      src="social-cloud.png"
      class="product"
      id="a2"
      data-code="A2"
    >

    <div
      class="label"
      id="a2-label"
    >
      A2
    </div>


    <img
      src="dad-healer.png"
      class="product"
      id="a3"
      data-code="A3"
    >

    <div
      class="label"
      id="a3-label"
    >
      A3
    </div>



    <!-- =====================
         ROW B
    ====================== -->

    <img
      src="before-i-speak.png"
      class="product"
      id="b1"
      data-code="B1"
    >

    <div
      class="label"
      id="b1-label"
    >
      B1
    </div>


    <img
      src="perfume.png"
      class="product"
      id="b2"
      data-code="B2"
    >

    <div
      class="label"
      id="b2-label"
    >
      B2
    </div>


    <img
      src="body-fonts.png"
      class="product"
      id="b3"
      data-code="B3"
    >

    <div
      class="label"
      id="b3-label"
    >
      B3
    </div>



    <!-- =====================
         ROW C
    ====================== -->

    <img
      src="city-walk.png"
      class="product"
      id="c1"
      data-code="C1"
    >

    <div
      class="label"
      id="c1-label"
    >
      C1
    </div>


    <img
      src="quiet-town.png"
      class="product"
      id="c2"
      data-code="C2"
    >

    <div
      class="label"
      id="c2-label"
    >
      C2
    </div>


    <img
      src="hypertext.png"
      class="product"
      id="c3"
      data-code="C3"
    >

    <div
      class="label"
      id="c3-label"
    >
      C3
    </div>



    <!-- =====================
         ROW D
    ====================== -->

    <img
      src="in-between.png"
      class="product"
      id="d1"
      data-code="D1"
    >

    <div
      class="label"
      id="d1-label"
    >
      D1
    </div>

  </div>



  <!-- COIN -->

  <img
    src="coin.png"
    class="coin"
    id="coin"
    alt="coin"
  >


  <div
    class="status"
    id="status"
  >
    $0.00
  </div>


  <div
    class="thankyou"
    id="thankyou"
  >
    THANK YOU
  </div>

</div>



<script>

/* =====================================
   ELEMENTS
===================================== */

const coin =
  document.getElementById(
    "coin"
  );

const coinSlot =
  document.getElementById(
    "coinSlot"
  );

const machine =
  document.getElementById(
    "machine"
  );

const status =
  document.getElementById(
    "status"
  );

const thankyou =
  document.getElementById(
    "thankyou"
  );

const instruction =
  document.getElementById(
    "instruction"
  );

const products =
  document.querySelectorAll(
    ".product"
  );


/* =====================================
   STATE
===================================== */

let hasCoin = false;

let dragging = false;

let dragOffsetX = 0;
let dragOffsetY = 0;

let dispensing = false;


/* =====================================
   RESET COIN
===================================== */

function resetCoin() {

  coin.style.display =
    "block";

  coin.style.left =
    "45px";

  coin.style.top =
    "auto";

  coin.style.bottom =
    "45px";
}


/* =====================================
   START DRAG
===================================== */

coin.addEventListener(
  "pointerdown",
  function(e) {

    if (
      hasCoin ||
      dispensing
    ) {
      return;
    }

    dragging = true;


    const rect =
      coin.getBoundingClientRect();


    dragOffsetX =
      e.clientX -
      rect.left;

    dragOffsetY =
      e.clientY -
      rect.top;


    coin.style.bottom =
      "auto";


    coin.setPointerCapture(
      e.pointerId
    );

  }
);


/* =====================================
   DRAG
===================================== */

coin.addEventListener(
  "pointermove",
  function(e) {

    if (!dragging) {
      return;
    }


    coin.style.left =
      (
        e.clientX -
        dragOffsetX
      ) + "px";


    coin.style.top =
      (
        e.clientY -
        dragOffsetY
      ) + "px";

  }
);


/* =====================================
   RELEASE
===================================== */

coin.addEventListener(
  "pointerup",
  function(e) {

    if (!dragging) {
      return;
    }


    dragging = false;


    const coinRect =
      coin.getBoundingClientRect();


    const slotRect =
      coinSlot.getBoundingClientRect();


    const x =
      coinRect.left +
      coinRect.width / 2;


    const y =
      coinRect.top +
      coinRect.height / 2;


    const isInside =
      x >= slotRect.left &&
      x <= slotRect.right &&
      y >= slotRect.top &&
      y <= slotRect.bottom;


    if (isInside) {

      acceptCoin();

    }

    else {

      resetCoin();

    }

  }
);


/* =====================================
   ACCEPT COIN
===================================== */

function acceptCoin() {

  hasCoin = true;


  coin.style.display =
    "none";


  status.textContent =
    "$1.00";


  instruction.textContent =
    "COIN ACCEPTED → SELECT AN ITEM";


  /*
    投币成功以后
    红框变绿色
  */

  coinSlot.style.background =
    "rgba(0,255,0,.18)";

  coinSlot.style.border =
    "2px solid limegreen";

}


/* =====================================
   PRODUCT CLICK
===================================== */

products.forEach(
  function(product) {

    product.addEventListener(
      "click",
      function() {

        if (dispensing) {
          return;
        }


        if (!hasCoin) {

          status.textContent =
            "INSERT COIN";


          instruction.textContent =
            "DRAG THE COIN INTO THE RED AREA";


          setTimeout(
            function() {

              if (!hasCoin) {

                status.textContent =
                  "$0.00";

              }

            },
            900
          );


          return;

        }


        dispense(product);

      }
    );

  }
);


/* =====================================
   DISPENSE
===================================== */

function dispense(product) {

  dispensing = true;

  hasCoin = false;


  const productRect =
    product.getBoundingClientRect();


  const machineRect =
    machine.getBoundingClientRect();


  const falling =
    document.createElement(
      "img"
    );


  falling.src =
    product.getAttribute(
      "src"
    );


  falling.className =
    "dispensing";


  falling.style.width =
    productRect.width +
    "px";


  falling.style.height =
    productRect.height +
    "px";


  falling.style.left =
    productRect.left +
    "px";


  falling.style.top =
    productRect.top +
    "px";


  falling.style.transform =
    "rotate(0deg)";


  document.body.appendChild(
    falling
  );


  /*
    PICK UP HERE
  */

  const pickupX =
    machineRect.left +
    machineRect.width *
    0.37;


  const pickupY =
    machineRect.top +
    machineRect.height *
    0.80;


  requestAnimationFrame(
    function() {

      requestAnimationFrame(
        function() {

          falling.style.left =
            (
              pickupX -
              productRect.width / 2
            ) + "px";


          falling.style.top =
            (
              pickupY -
              productRect.height / 2
            ) + "px";


          falling.style.transform =
            "rotate(10deg)";

        }
      );

    }
  );


  status.textContent =
    "$0.00";


  instruction.textContent =
    "DISPENSING...";


  setTimeout(
    function() {

      thankyou.classList.add(
        "show"
      );


      instruction.textContent =
        "PICK UP YOUR DESIGN";

    },
    700
  );


  setTimeout(
    function() {

      falling.style.transition =
        "opacity .4s ease";


      falling.style.opacity =
        "0";

    },
    2500
  );


  setTimeout(
    function() {

      falling.remove();


      thankyou.classList.remove(
        "show"
      );


      resetCoin();


      status.textContent =
        "$0.00";


      instruction.textContent =
        "DRAG THE COIN INTO THE RED AREA";


      /*
        恢复红色投币区
      */

      coinSlot.style.background =
        "rgba(255,0,0,.20)";

      coinSlot.style.border =
        "2px solid red";


      dispensing = false;

    },
    3000
  );

}

</script>

</body>
</html>
