<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Take Your Design</title>

<style>

/* ==================================================
   BASIC
================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #efefef;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  overflow-x: hidden;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
}


/* ==================================================
   INSTRUCTION
================================================== */

.instruction {
  position: fixed;
  left: 28px;
  top: 28px;

  z-index: 100;

  font-size: 15px;
  letter-spacing: 1.5px;

  color: #111;

  pointer-events: none;
}


/* ==================================================
   MACHINE
================================================== */

.machine {
  position: relative;
  width: 560px;
  margin: 20px auto;
}

.machine-image {
  display: block;
  width: 100%;
  height: auto;

  pointer-events: none;
  user-select: none;
}


/* ==================================================
   PRODUCTS
================================================== */

.product {
  position: absolute;

  z-index: 10;

  object-fit: contain;

  transform: translate(-50%, -50%);
  transform-origin: center;

  cursor: pointer;

  filter:
    drop-shadow(
      0 4px 3px
      rgba(0,0,0,.18)
    );

  transition:
    transform .15s ease,
    filter .15s ease,
    opacity .25s ease;
}

.product:hover {
  transform:
    translate(-50%, -50%)
    scale(1.08);

  filter:
    drop-shadow(
      0 6px 5px
      rgba(0,0,0,.25)
    );
}


/* ==================================================
   ROW A
================================================== */

#a1 {
  width: 125px;
  height: 140px;

  left: 18%;
  top: 18%;
}

#a2 {
  width: 118px;
  height: 118px;

  left: 43%;
  top: 18%;
}

#a3 {
  width: 118px;
  height: 118px;

  left: 67%;
  top: 18%;
}


/* ==================================================
   ROW B
================================================== */

#b1 {
  width: 118px;
  height: 124px;

  left: 18%;
  top: 35%;
}

#b2 {
  width: 115px;
  height: 135px;

  left: 43%;
  top: 35%;
}

#b3 {
  width: 118px;
  height: 118px;

  left: 67%;
  top: 35%;
}


/* ==================================================
   ROW C
================================================== */

#c1 {
  width: 118px;
  height: 118px;

  left: 18%;
  top: 52%;
}

#c2 {
  width: 118px;
  height: 122px;

  left: 43%;
  top: 52%;
}

#c3 {
  width: 112px;
  height: 118px;

  left: 67%;
  top: 52%;
}


/* ==================================================
   ROW D
================================================== */

#d1 {
  width: 100px;
  height: 110px;

  left: 18%;
  top: 69%;
}


/* ==================================================
   LABELS
================================================== */

.label {
  position: absolute;

  z-index: 20;

  transform: translate(-50%, -50%);

  background: white;
  color: black;

  padding: 3px 6px;

  border-radius: 2px;

  font-size: 11px;
  font-weight: bold;

  pointer-events: none;
}


/* A */

#a1-label {
  left: 18%;
  top: 25.5%;
}

#a2-label {
  left: 43%;
  top: 25.5%;
}

#a3-label {
  left: 67%;
  top: 25.5%;
}


/* B */

#b1-label {
  left: 18%;
  top: 42.5%;
}

#b2-label {
  left: 43%;
  top: 42.5%;
}

#b3-label {
  left: 67%;
  top: 42.5%;
}


/* C */

#c1-label {
  left: 18%;
  top: 59.5%;
}

#c2-label {
  left: 43%;
  top: 59.5%;
}

#c3-label {
  left: 67%;
  top: 59.5%;
}


/* D */

#d1-label {
  left: 18%;
  top: 75%;
}


/* ==================================================
   INVISIBLE COIN SLOT
================================================== */

.coin-slot {
  position: absolute;

  right: 8%;
  top: 31.5%;

  width: 10%;
  height: 11%;

  z-index: 9;

  background: transparent;
  border: none;
}


/* ==================================================
   PICKUP GLOW
================================================== */

/*
  这个区域只负责发光。
  不会显示边框。
*/

.pickup-glow {
  position: absolute;

  left: 12%;
  top: 77%;

  width: 60%;
  height: 12%;

  z-index: 8;

  pointer-events: none;

  border-radius: 12px;

  opacity: 0;

  box-shadow:
    0 0 15px rgba(255,255,255,0),
    0 0 30px rgba(255,255,255,0);

  transition:
    opacity .35s ease,
    box-shadow .35s ease;
}


/*
  商品掉下来以后开始呼吸发光
*/

.pickup-glow.active {
  opacity: 1;

  animation:
    pickupPulse 1.2s ease-in-out infinite;
}


@keyframes pickupPulse {

  0% {
    box-shadow:
      0 0 10px rgba(255,255,255,.15),
      0 0 20px rgba(255,255,255,.08);
  }

  50% {
    box-shadow:
      0 0 18px rgba(255,255,255,.60),
      0 0 38px rgba(255,255,255,.28);
  }

  100% {
    box-shadow:
      0 0 10px rgba(255,255,255,.15),
      0 0 20px rgba(255,255,255,.08);
  }

}


/* ==================================================
   COIN
================================================== */

.coin {
  position: fixed;

  left: 35px;
  bottom: 35px;

  width: 76px;
  height: 76px;

  object-fit: contain;

  cursor: grab;

  z-index: 100;

  user-select: none;
  -webkit-user-select: none;

  filter:
    drop-shadow(
      0 8px 7px
      rgba(0,0,0,.30)
    );

  transition: transform .15s ease;
}

.coin:hover {
  transform: scale(1.08);
}

.coin.dragging {
  cursor: grabbing;
  transform: scale(1.13);
}


/* ==================================================
   STATUS
================================================== */

.status {
  position: fixed;

  left: calc(50% + 360px);
  top: 245px;

  z-index: 100;

  font-family: monospace;
  font-size: 15px;

  color: #ff2525;
}


/* ==================================================
   THANK YOU
================================================== */

.thankyou {
  position: fixed;

  left: calc(50% + 330px);
  top: 405px;

  z-index: 100;

  background: #111;
  color: white;

  padding: 9px 16px;

  font-size: 14px;
  font-weight: bold;

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s ease;
}

.thankyou.show {
  opacity: 1;
}


/* ==================================================
   FALLING / PICKUP PRODUCT
================================================== */

.dispensing {
  position: fixed;

  z-index: 500;

  object-fit: contain;

  transform-origin: center;

  pointer-events: none;
}


/*
  商品已经掉到取货口以后
  允许点击
*/

.dispensing.ready {
  pointer-events: auto;

  cursor: pointer;

  transition:
    transform .2s ease,
    filter .2s ease;

  filter:
    drop-shadow(
      0 8px 10px
      rgba(0,0,0,.35)
    );
}


.dispensing.ready:hover {
  transform:
    rotate(8deg)
    scale(1.08) !important;

  filter:
    drop-shadow(
      0 10px 14px
      rgba(0,0,0,.45)
    );
}


/* ==================================================
   MODAL / DARK BACKGROUND
================================================== */

.product-overlay {
  position: fixed;

  inset: 0;

  z-index: 9000;

  background:
    rgba(0,0,0,.68);

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .35s ease;

  cursor: zoom-out;
}


.product-overlay.show {
  opacity: 1;

  pointer-events: auto;
}


/* ==================================================
   LARGE PRODUCT
================================================== */

.large-product {
  position: fixed;

  z-index: 9001;

  object-fit: contain;

  pointer-events: none;

  filter:
    drop-shadow(
      0 25px 35px
      rgba(0,0,0,.40)
    );

  transition:
    left .55s cubic-bezier(.2,.8,.2,1),
    top .55s cubic-bezier(.2,.8,.2,1),
    width .55s cubic-bezier(.2,.8,.2,1),
    height .55s cubic-bezier(.2,.8,.2,1),
    transform .55s cubic-bezier(.2,.8,.2,1);
}


/* ==================================================
   CLOSE BUTTON
================================================== */

.close-button {
  position: fixed;

  right: 32px;
  top: 25px;

  z-index: 9002;

  width: 46px;
  height: 46px;

  border: none;
  border-radius: 50%;

  background: white;
  color: black;

  font-size: 27px;
  font-weight: 300;

  line-height: 46px;
  text-align: center;

  cursor: pointer;

  opacity: 0;

  pointer-events: none;

  transition:
    opacity .3s ease,
    transform .2s ease;
}


.close-button.show {
  opacity: 1;

  pointer-events: auto;
}


.close-button:hover {
  transform: scale(1.08);
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 850px) {

  .machine {
    width: min(560px, 92vw);
    margin-top: 70px;
  }

  .instruction {
    left: 15px;
    top: 15px;

    font-size: 12px;
  }

  .coin {
    width: 55px;
    height: 55px;

    left: 15px;
    bottom: 15px;
  }

  .close-button {
    right: 18px;
    top: 18px;

    width: 40px;
    height: 40px;

    line-height: 40px;
  }

}

</style>
</head>


<body>

<div class="page">


  <!-- ==================================================
       INSTRUCTION

  <div
    class="instruction"

  >

  <!-- ==================================================

<script>

/* ==================================================
   ELEMENTS
================================================== */

const coin =
  document.getElementById("coin");

const coinSlot =
  document.getElementById("coinSlot");

const machine =
  document.getElementById("machine");

const status =
  document.getElementById("status");

const thankyou =
  document.getElementById("thankyou");

const instruction =
  document.getElementById("instruction");

const products =
  document.querySelectorAll(".product");

const pickupGlow =
  document.getElementById("pickupGlow");

const productOverlay =
  document.getElementById("productOverlay");

const closeButton =
  document.getElementById("closeButton");


/* ==================================================
   STATE
================================================== */

let dragging = false;

let paid = false;

let dispensing = false;

let viewingProduct = false;

let offsetX = 0;

let offsetY = 0;

let pickupProduct = null;

let originalProduct = null;

let largeProduct = null;


/* ==================================================
   COIN DRAG START
================================================== */

coin.addEventListener(
  "mousedown",
  function(e) {

    if (
      paid ||
      dispensing ||
      viewingProduct
    ) {
      return;
    }

    e.preventDefault();

    dragging = true;

    coin.classList.add(
      "dragging"
    );

    const rect =
      coin.getBoundingClientRect();

    offsetX =
      e.clientX -
      rect.left;

    offsetY =
      e.clientY -
      rect.top;

    coin.style.bottom =
      "auto";

    coin.style.transition =
      "none";

  }
);


/* ==================================================
   COIN MOVE
================================================== */

document.addEventListener(
  "mousemove",
  function(e) {

    if (!dragging) {
      return;
    }

    coin.style.left =
      (
        e.clientX -
        offsetX
      ) + "px";

    coin.style.top =
      (
        e.clientY -
        offsetY
      ) + "px";

  }
);


/* ==================================================
   COIN RELEASE
================================================== */

document.addEventListener(
  "mouseup",
  function() {

    if (!dragging) {
      return;
    }

    dragging = false;

    coin.classList.remove(
      "dragging"
    );

    checkCoin();

  }
);


/* ==================================================
   CHECK COIN
================================================== */

function checkCoin() {

  const coinRect =
    coin.getBoundingClientRect();

  const slotRect =
    coinSlot.getBoundingClientRect();


  const x =
    coinRect.left +
    coinRect.width / 2;

  const y =
    coinRect.top +
    coinRect.height / 2;


  const inside =

    x > slotRect.left &&

    x < slotRect.right &&

    y > slotRect.top &&

    y < slotRect.bottom;


  if (inside) {

    paid = true;

    status.textContent =
      "$1.00";

    instruction.textContent =
      "COIN ACCEPTED → SELECT AN ITEM";


    coin.style.transition =
      "all .30s ease";


    coin.style.left =
      (
        slotRect.left +
        slotRect.width / 2 -
        coinRect.width / 2
      ) + "px";


    coin.style.top =
      (
        slotRect.top +
        slotRect.height / 2 -
        coinRect.height / 2
      ) + "px";


    coin.style.transform =
      "scale(.05) rotate(180deg)";


    coin.style.opacity =
      "0";

  }

  else {

    resetCoin();

  }

}


/* ==================================================
   RESET COIN
================================================== */

function resetCoin() {

  coin.style.transition =
    "all .35s ease";

  coin.style.transform =
    "";

  coin.style.opacity =
    "1";

  coin.style.left =
    "35px";

  coin.style.top =
    "auto";

  coin.style.bottom =
    "35px";

}


/* ==================================================
   PRODUCT CLICK
================================================== */

products.forEach(
  function(product) {

    product.addEventListener(
      "click",
      function() {

        if (
          dispensing ||
          viewingProduct
        ) {
          return;
        }


        if (!paid) {

          status.textContent =
            "INSERT COIN";

          instruction.textContent =
            "INSERT COIN FIRST";


          setTimeout(
            function() {

              if (!paid) {

                status.textContent =
                  "$0.00";

                instruction.textContent =
                  "DRAG THE COIN → SELECT SOMETHING";

              }

            },
            1000
          );


          return;

        }


        dispenseProduct(
          product
        );

      }
    );

  }
);


/* ==================================================
   DISPENSE PRODUCT
================================================== */

function dispenseProduct(
  product
) {

  if (
    !paid ||
    dispensing
  ) {
    return;
  }


  dispensing = true;

  paid = false;

  originalProduct =
    product;


  const productRect =
    product.getBoundingClientRect();

  const machineRect =
    machine.getBoundingClientRect();


  const falling =
    document.createElement(
      "img"
    );


  falling.src =
    product.getAttribute(
      "src"
    );


  falling.className =
    "dispensing";


  falling.style.width =
    productRect.width +
    "px";


  falling.style.height =
    productRect.height +
    "px";


  falling.style.left =
    productRect.left +
    "px";


  falling.style.top =
    productRect.top +
    "px";


  falling.style.transform =
    "rotate(0deg) scale(1)";


  falling.style.opacity =
    "1";


  falling.style.transition =
    "left .85s cubic-bezier(.3,.05,.7,1), " +
    "top .85s cubic-bezier(.3,.05,.7,1), " +
    "transform .85s ease";


  document.body.appendChild(
    falling
  );


  product.style.visibility =
    "hidden";


  /*
     PICKUP POSITION

     保留之前的掉落逻辑
  */

  const pickupX =
    machineRect.left +
    machineRect.width *
    0.36;


  const pickupY =
    machineRect.top +
    machineRect.height *
    0.82;


  requestAnimationFrame(
    function() {

      requestAnimationFrame(
        function() {

          falling.style.left =
            (
              pickupX -
              productRect.width / 2
            ) + "px";


          falling.style.top =
            (
              pickupY -
              productRect.height / 2
            ) + "px";


          falling.style.transform =
            "rotate(8deg) scale(.95)";

        }
      );

    }
  );


  status.textContent =
    "$0.00";

  instruction.textContent =
    "DISPENSING...";


  /*
     商品到达取货口
  */

  setTimeout(
    function() {

      pickupProduct =
        falling;


      falling.classList.add(
        "ready"
      );


      pickupGlow.classList.add(
        "active"
      );


      thankyou.classList.add(
        "show"
      );


      instruction.textContent =
        "CLICK YOUR DESIGN TO PICK IT UP";


      falling.addEventListener(
        "click",
        function() {

          openProduct(
            falling
          );

        },
        {
          once: true
        }
      );


    },
    900
  );

}


/* ==================================================
   OPEN / ENLARGE PRODUCT
================================================== */

function openProduct(
  pickupItem
) {

  if (viewingProduct) {
    return;
  }


  viewingProduct =
    true;


  pickupGlow.classList.remove(
    "active"
  );


  thankyou.classList.remove(
    "show"
  );


  instruction.textContent =
    "YOUR DESIGN";


  /*
     获取取货口商品当前位置
  */

  const rect =
    pickupItem.getBoundingClientRect();


  /*
     创建放大版本
  */

  largeProduct =
    document.createElement(
      "img"
    );


  largeProduct.src =
    pickupItem.src;


  largeProduct.className =
    "large-product";


  /*
     从取货口原位置开始
  */

  largeProduct.style.left =
    rect.left +
    "px";


  largeProduct.style.top =
    rect.top +
    "px";


  largeProduct.style.width =
    rect.width +
    "px";


  largeProduct.style.height =
    rect.height +
    "px";


  largeProduct.style.transform =
    "rotate(8deg)";


  document.body.appendChild(
    largeProduct
  );


  /*
     原取货商品隐藏
  */

  pickupItem.style.visibility =
    "hidden";


  /*
     背景出现
  */

  productOverlay.classList.add(
    "show"
  );


  closeButton.classList.add(
    "show"
  );


  /*
     计算最终放大尺寸
  */

  const maxWidth =
    Math.min(
      window.innerWidth * .55,
      520
    );


  const maxHeight =
    Math.min(
      window.innerHeight * .72,
      650
    );


  const ratio =
    rect.width /
    rect.height;


  let finalWidth =
    maxWidth;


  let finalHeight =
    finalWidth /
    ratio;


  if (
    finalHeight >
    maxHeight
  ) {

    finalHeight =
      maxHeight;

    finalWidth =
      finalHeight *
      ratio;

  }


  const finalLeft =
    (
      window.innerWidth -
      finalWidth
    ) / 2;


  const finalTop =
    (
      window.innerHeight -
      finalHeight
    ) / 2;


  /*
     飞到屏幕中央
  */

  requestAnimationFrame(
    function() {

      requestAnimationFrame(
        function() {

          largeProduct.style.left =
            finalLeft +
            "px";


          largeProduct.style.top =
            finalTop +
            "px";


          largeProduct.style.width =
            finalWidth +
            "px";


          largeProduct.style.height =
            finalHeight +
            "px";


          largeProduct.style.transform =
            "rotate(0deg)";

        }
      );

    }
  );

}


/* ==================================================
   CLOSE LARGE PRODUCT
================================================== */

function closeProduct() {

  if (
    !viewingProduct ||
    !largeProduct ||
    !pickupProduct
  ) {
    return;
  }


  const pickupRect =
    pickupProduct.getBoundingClientRect();


  /*
     背景关闭
  */

  productOverlay.classList.remove(
    "show"
  );


  closeButton.classList.remove(
    "show"
  );


  /*
     大图飞回取货口
  */

  largeProduct.style.left =
    pickupRect.left +
    "px";


  largeProduct.style.top =
    pickupRect.top +
    "px";


  largeProduct.style.width =
    pickupRect.width +
    "px";


  largeProduct.style.height =
    pickupRect.height +
    "px";


  largeProduct.style.transform =
    "rotate(8deg)";


  /*
     动画结束以后彻底恢复
  */

  setTimeout(
    function() {

      if (largeProduct) {

        largeProduct.remove();

        largeProduct =
          null;

      }


      if (pickupProduct) {

        pickupProduct.remove();

        pickupProduct =
          null;

      }


      if (originalProduct) {

        originalProduct.style.visibility =
          "visible";

        originalProduct =
          null;

      }


      viewingProduct =
        false;


      dispensing =
        false;


      status.textContent =
        "$0.00";


      instruction.textContent =
        "DRAG THE COIN → SELECT SOMETHING";


      resetCoin();

    },
    560
  );

}


/* ==================================================
   CLOSE EVENTS
================================================== */

productOverlay.addEventListener(
  "click",
  closeProduct
);


closeButton.addEventListener(
  "click",
  closeProduct
);


/*
   ESC 也可以关闭
*/

document.addEventListener(
  "keydown",
  function(e) {

    if (
      e.key === "Escape" &&
      viewingProduct
    ) {

      closeProduct();

    }

  }
);

</script>

</body>
</html>
