<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Take Your Design</title>

<style>

/* ==================================================
   BASIC
================================================== */

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #efefef;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  overflow-x: hidden;
}

.page {
  position: relative;
  width: 100%;
  min-height: 100vh;
}


/* ==================================================
   INSTRUCTION
================================================== */

.instruction {
  position: fixed;

  left: 28px;
  top: 28px;

  z-index: 100;

  font-size: 15px;
  letter-spacing: 1.5px;

  color: #111;
}


/* ==================================================
   MACHINE
================================================== */

.machine {
  position: relative;

  width: 560px;

  margin: 20px auto;
}

.machine-image {
  display: block;

  width: 100%;
  height: auto;
}


/* ==================================================
   PRODUCTS
================================================== */

.product {
  position: absolute;

  z-index: 10;

  object-fit: contain;

  transform: translate(-50%, -50%);
  transform-origin: center;

  cursor: pointer;

  filter: drop-shadow(
    0 3px 2px rgba(0,0,0,.15)
  );

  transition:
    transform .15s ease,
    filter .15s ease;
}

.product:hover {
  transform:
    translate(-50%, -50%)
    scale(1.08);

  filter: drop-shadow(
    0 5px 4px rgba(0,0,0,.22)
  );
}


/* ==================================================
   PRODUCT SIZE
================================================== */

#a1 {
  width: 54px;
  height: 70px;
}

#a2 {
  width: 82px;
  height: 82px;
}

#a3 {
  width: 82px;
  height: 82px;
}

#b1 {
  width: 82px;
  height: 86px;
}

#b2 {
  width: 64px;
  height: 86px;
}

#b3 {
  width: 82px;
  height: 82px;
}

#c1 {
  width: 82px;
  height: 82px;
}

#c2 {
  width: 82px;
  height: 86px;
}

#c3 {
  width: 78px;
  height: 82px;
}

#d1 {
  width: 70px;
  height: 78px;
}


/* ==================================================
   PRODUCT POSITION
================================================== */

/* ---------- ROW A ---------- */

#a1 {
  left: 17%;
  top: 24%;
}

#a2 {
  left: 37%;
  top: 24%;
}

#a3 {
  left: 57%;
  top: 24%;
}


/* ---------- ROW B ---------- */

#b1 {
  left: 17%;
  top: 41.5%;
}

#b2 {
  left: 37%;
  top: 41.5%;
}

#b3 {
  left: 57%;
  top: 41.5%;
}


/* ---------- ROW C ---------- */

#c1 {
  left: 17%;
  top: 59%;
}

#c2 {
  left: 37%;
  top: 59%;
}

#c3 {
  left: 57%;
  top: 59%;
}


/* ---------- ROW D ---------- */

#d1 {
  left: 17%;
  top: 74%;
}


/* ==================================================
   LABELS
================================================== */

.label {
  position: absolute;

  z-index: 20;

  transform: translate(-50%, -50%);

  background: white;
  color: black;

  padding: 3px 6px;

  border-radius: 2px;

  font-size: 11px;
  font-weight: bold;

  pointer-events: none;
}


/* ROW A */

#a1-label {
  left: 17%;
  top: 30.5%;
}

#a2-label {
  left: 37%;
  top: 30.5%;
}

#a3-label {
  left: 57%;
  top: 30.5%;
}


/* ROW B */

#b1-label {
  left: 17%;
  top: 48%;
}

#b2-label {
  left: 37%;
  top: 48%;
}

#b3-label {
  left: 57%;
  top: 48%;
}


/* ROW C */

#c1-label {
  left: 17%;
  top: 65.5%;
}

#c2-label {
  left: 37%;
  top: 65.5%;
}

#c3-label {
  left: 57%;
  top: 65.5%;
}


/* ROW D */

#d1-label {
  left: 17%;
  top: 80%;
}


/* ==================================================
   COIN SLOT
   红色区域 = 投币有效区域
================================================== */

.coin-slot {
  position: absolute;

  left: 79%;
  top: 27%;

  width: 14%;
  height: 16%;

  z-index: 30;

  background: rgba(255,0,0,.20);

  border: 2px solid red;

  border-radius: 8px;

  pointer-events: none;

  transition:
    background .2s ease,
    border .2s ease;
}


/* ==================================================
   COIN
================================================== */

.coin {
  position: fixed;

  width: 72px;
  height: 72px;

  left: 45px;
  bottom: 45px;

  z-index: 9999;

  object-fit: contain;

  cursor: grab;

  user-select: none;
  -webkit-user-select: none;

  touch-action: none;

  filter: drop-shadow(
    0 5px 5px rgba(0,0,0,.18)
  );

  will-change:
    left,
    top,
    transform;
}

.coin:active {
  cursor: grabbing;
}


/* ==================================================
   STATUS
================================================== */

.status {
  position: fixed;

  left: calc(50% + 360px);
  top: 245px;

  z-index: 100;

  font-family: monospace;
  font-size: 15px;

  color: #ff2525;
}


/* ==================================================
   THANK YOU
================================================== */

.thankyou {
  position: fixed;

  left: calc(50% + 330px);
  top: 405px;

  z-index: 100;

  background: #111;
  color: white;

  padding: 9px 16px;

  font-size: 14px;
  font-weight: bold;

  opacity: 0;

  pointer-events: none;

  transition: opacity .2s ease;
}

.thankyou.show {
  opacity: 1;
}


/* ==================================================
   FALLING PRODUCT
================================================== */

.dispensing {
  position: fixed;

  z-index: 9998;

  object-fit: contain;

  pointer-events: none;

  transform-origin: center;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 850px) {

  .machine {
    width: min(560px, 92vw);

    margin-top: 70px;
  }

  .instruction {
    left: 15px;
    top: 15px;

    font-size: 12px;
  }

  .coin {
    width: 58px;
    height: 58px;

    left: 20px;
    bottom: 25px;
  }

}

</style>

</head>


<body>

<div class="page">


  <!-- ==========================================
       INSTRUCTION
  =========================================== -->

  <div
    class="instruction"
    id="instruction"
  >
    DRAG THE COIN INTO THE RED AREA
  </div>



  <!-- ==========================================
       MACHINE
  =========================================== -->

  <div
    class="machine"
    id="machine"
  >


    <img
      src="vending-machine.png"
      class="machine-image"
      alt="Vending Machine"
      draggable="false"
    >



    <!-- ========================================
         COIN TARGET
    ========================================= -->

    <div

    <!-- ========================================

    ========================================= -->


    <!-- A1 -->

    <img

    >

    >

    <!-- A3 -->

    <img
      src="dad-healer.png"
      class="product"
      id="a3"
      data-code="A3"

    >

    <div

    >

    <!-- ========================================

    ========================================= -->


    <!-- B1 -->

    <img

    >

      class="label"

    >

    </div>



    <!-- B2 -->

    <img
      src="perfume.png"
      class="product"
      id="b2"
      data-code="B2"
      draggable="false"
    >

    <div
      class="label"
      id="b2-label"
    >
      B2
    </div>



    <!-- B3 -->

    <img
      src="body-fonts.png"
      class="product"
      id="b3"
      data-code="B3"
      draggable="false"
    >

    <div
      class="label"
      id="b3-label"
    >
      B3
    </div>



    <!-- ========================================
         ROW C
    ========================================= -->


    <!-- C1 -->

    <img
      src="city-walk.png"
      class="product"
      id="c1"
      data-code="C1"
      draggable="false"
    >

    <div
      class="label"
      id="c1-label"
    >
      C1
    </div>



    <!-- C2 -->

    <img
      src="quiet-town.png"
      class="product"
      id="c2"
      data-code="C2"
      draggable="false"
    >

    <div
      class="label"
      id="c2-label"
    >

    </div>



    <!-- C3 -->

    <img
      src="hypertext.png"
      class="product"
      id="c3"
      data-code="C3"
      draggable="false"
    >

    <div
      class="label"

    >
      C3
    </div>



    <!-- ========================================
         ROW D
    ========================================= -->


    <!-- D1 -->

    <img
      src="in-between.png"
      class="product"
      id="d1"
      data-code="D1"
      draggable="false"
    >

    <div
      class="label"
      id="d1-label"
    >
      D1

  </div>



  <!-- ==========================================
       COIN
  =========================================== -->

  <img
    src="coin.png"
    class="coin"
    id="coin"
    alt="Coin"
    draggable="false"
  >



  <!-- ==========================================
       STATUS
  =========================================== -->

  <div
    class="status"
    id="status"
  >
    $0.00
  </div>



  <!-- ==========================================
       THANK YOU
  =========================================== -->

  <div
    class="thankyou"
    id="thankyou"
  >
    THANK YOU
  </div>


</div>



<script>

/* ==================================================
   ELEMENTS
================================================== */

const coin =
  document.getElementById("coin");

const coinSlot =
  document.getElementById("coinSlot");

const machine =
  document.getElementById("machine");

const status =
  document.getElementById("status");

const thankyou =
  document.getElementById("thankyou");

const instruction =
  document.getElementById("instruction");

const products =
  document.querySelectorAll(".product");



/* ==================================================
   STATE
================================================== */

let hasCoin = false;

let isDragging = false;

let dispensing = false;

let offsetX = 0;

let offsetY = 0;



/* ==================================================
   RESET COIN
================================================== */

function resetCoin() {

  coin.style.display = "block";

  coin.style.position = "fixed";

  coin.style.left = "45px";

  coin.style.top = "auto";

  coin.style.right = "auto";

  coin.style.bottom = "45px";

  coin.style.opacity = "1";

  coin.style.transform = "scale(1)";

  coin.style.transition = "";

  coin.style.cursor = "grab";

  isDragging = false;

}



/* ==================================================
   START DRAG
================================================== */

coin.addEventListener(
  "pointerdown",
  function(e) {

    if (
      hasCoin ||
      dispensing
    ) {
      return;
    }


    e.preventDefault();


    const rect =
      coin.getBoundingClientRect();


    /*
      IMPORTANT

      先把 bottom 定位转换成
      当前真实的 left/top。

      这样开始拖的时候不会跳。
    */

    coin.style.left =
      rect.left + "px";

    coin.style.top =
      rect.top + "px";

    coin.style.bottom =
      "auto";

    coin.style.right =
      "auto";


    offsetX =
      e.clientX -
      rect.left;

    offsetY =
      e.clientY -
      rect.top;


    isDragging = true;


    coin.style.cursor =
      "grabbing";

  }
);



/* ==================================================
   DRAG

   注意：
   这里监听 document，
   不是监听 coin。

   所以鼠标移动出 coin 本身以后
   仍然可以继续拖。
================================================== */

document.addEventListener(
  "pointermove",
  function(e) {

    if (!isDragging) {
      return;
    }


    e.preventDefault();


    const newX =
      e.clientX -
      offsetX;


    const newY =
      e.clientY -
      offsetY;


    coin.style.left =
      newX + "px";


    coin.style.top =
      newY + "px";

  },
  {
    passive: false
  }
);



/* ==================================================
   RELEASE
================================================== */

document.addEventListener(
  "pointerup",
  function() {

    if (!isDragging) {
      return;
    }


    isDragging = false;


    coin.style.cursor =
      "grab";


    checkCoinDrop();

  }
);



/* ==================================================
   POINTER CANCEL
================================================== */

document.addEventListener(
  "pointercancel",
  function() {

    if (!isDragging) {
      return;
    }


    isDragging = false;


    resetCoin();

  }
);



/* ==================================================
   CHECK COIN DROP
================================================== */

function checkCoinDrop() {

  const coinRect =
    coin.getBoundingClientRect();


  const slotRect =
    coinSlot.getBoundingClientRect();



  /*
    找 coin 和 slot 的重叠区域
  */

  const overlapLeft =
    Math.max(
      coinRect.left,
      slotRect.left
    );


  const overlapRight =
    Math.min(
      coinRect.right,
      slotRect.right
    );


  const overlapTop =
    Math.max(
      coinRect.top,
      slotRect.top
    );


  const overlapBottom =
    Math.min(
      coinRect.bottom,
      slotRect.bottom
    );



  const overlapWidth =
    Math.max(
      0,
      overlapRight -
      overlapLeft
    );


  const overlapHeight =
    Math.max(
      0,
      overlapBottom -
      overlapTop
    );


  const overlapArea =
    overlapWidth *
    overlapHeight;


  const coinArea =
    coinRect.width *
    coinRect.height;



  /*
    只需要 15% 的 coin
    进入红框。

    所以很好投，
    不需要非常精确。
  */

  const successfulDrop =
    overlapArea >
    coinArea * 0.15;



  if (successfulDrop) {

    acceptCoin();

  }

  else {

    resetCoin();


    instruction.textContent =
      "TRY AGAIN — DROP THE COIN IN THE RED AREA";


    setTimeout(
      function() {

        if (!hasCoin) {

          instruction.textContent =
            "DRAG THE COIN INTO THE RED AREA";

        }

      },
      1200
    );

  }

}



/* ==================================================
   ACCEPT COIN
================================================== */

function acceptCoin() {

  hasCoin = true;


  const slotRect =
    coinSlot.getBoundingClientRect();


  const coinRect =
    coin.getBoundingClientRect();



  /*
    硬币吸到投币区中央
  */

  const targetX =
    slotRect.left +
    slotRect.width / 2 -
    coinRect.width / 2;


  const targetY =
    slotRect.top +
    slotRect.height / 2 -
    coinRect.height / 2;



  coin.style.transition =
    "left .22s ease, " +
    "top .22s ease, " +
    "transform .22s ease, " +
    "opacity .22s ease";


  coin.style.left =
    targetX + "px";


  coin.style.top =
    targetY + "px";


  coin.style.transform =
    "scale(.2)";


  coin.style.opacity =
    "0";



  /*
    状态改变
  */

  status.textContent =
    "$1.00";


  instruction.textContent =
    "COIN ACCEPTED → SELECT AN ITEM";


  coinSlot.style.background =
    "rgba(0,255,0,.20)";


  coinSlot.style.border =
    "2px solid limegreen";



  /*
    吸进去以后隐藏 coin
  */

  setTimeout(
    function() {

      coin.style.display =
        "none";

      coin.style.transition =
        "";

    },
    230
  );

}



/* ==================================================
   CLICK PRODUCTS
================================================== */

products.forEach(
  function(product) {

    product.addEventListener(
      "click",
      function() {


        if (dispensing) {
          return;
        }



        /*
          没投币
        */

        if (!hasCoin) {

          status.textContent =
            "INSERT COIN";


          instruction.textContent =
            "INSERT COIN FIRST";


          setTimeout(
            function() {

              if (!hasCoin) {

                status.textContent =
                  "$0.00";


                instruction.textContent =
                  "DRAG THE COIN INTO THE RED AREA";

              }

            },
            1000
          );


          return;
        }



        /*
          已投币
        */

        dispense(product);

      }
    );

  }
);



/* ==================================================
   DISPENSE PRODUCT
================================================== */

function dispense(product) {

  if (
    !hasCoin ||
    dispensing
  ) {
    return;
  }


  dispensing = true;

  hasCoin = false;



  const productRect =
    product.getBoundingClientRect();


  const machineRect =
    machine.getBoundingClientRect();



  /*
    创建商品副本
  */

  const falling =
    document.createElement(
      "img"
    );


  falling.src =
    product.getAttribute(
      "src"
    );


  falling.className =
    "dispensing";


  falling.style.width =
    productRect.width +
    "px";


  falling.style.height =
    productRect.height +
    "px";


  falling.style.left =
    productRect.left +
    "px";


  falling.style.top =
    productRect.top +
    "px";


  falling.style.transform =
    "rotate(0deg) scale(1)";


  falling.style.opacity =
    "1";


  falling.style.transition =
    "left .85s cubic-bezier(.3,.05,.7,1), " +
    "top .85s cubic-bezier(.3,.05,.7,1), " +
    "transform .85s ease";


  document.body.appendChild(
    falling
  );



  /*
    原来的商品隐藏。

    这样看起来就是商品
    真正从货架掉下来。
  */

  product.style.visibility =
    "hidden";



  /*
    PICK UP HERE

    这里决定最终掉到哪里。
  */

  const pickupX =
    machineRect.left +
    machineRect.width *
    0.36;


  const pickupY =
    machineRect.top +
    machineRect.height *
    0.82;



  /*
    开始掉落
  */

  requestAnimationFrame(
    function() {

      requestAnimationFrame(
        function() {


          falling.style.left =
            (
              pickupX -
              productRect.width / 2
            ) + "px";


          falling.style.top =
            (
              pickupY -
              productRect.height / 2
            ) + "px";


          falling.style.transform =
            "rotate(12deg) scale(.95)";

        }
      );

    }
  );



  status.textContent =
    "$0.00";


  instruction.textContent =
    "DISPENSING...";



  /*
    到达取货口
  */

  setTimeout(
    function() {


      thankyou.classList.add(
        "show"
      );


      instruction.textContent =
        "PICK UP YOUR DESIGN";


    },
    850
  );



  /*
    在取货口停留
  */

  setTimeout(
    function() {


      falling.style.transition =
        "opacity .35s ease";


      falling.style.opacity =
        "0";


    },
    2500
  );



  /*
    RESET
  */

  setTimeout(
    function() {


      falling.remove();


      /*
        商品重新放回货架
      */

      product.style.visibility =
        "visible";


      /*
        THANK YOU 消失
      */

      thankyou.classList.remove(
        "show"
      );


      /*
        投币框恢复红色
      */

      coinSlot.style.background =
        "rgba(255,0,0,.20)";


      coinSlot.style.border =
        "2px solid red";


      /*
        硬币回来
      */

      resetCoin();


      status.textContent =
        "$0.00";


      instruction.textContent =
        "DRAG THE COIN INTO THE RED AREA";


      dispensing =
        false;


    },
    2900
  );

}



/* ==================================================
   INITIALIZE
================================================== */

resetCoin();

</script>
